/* ---------- numpad (takes the PropertyManager's place) ---------- */
#numpad {
  position: absolute; z-index: 20; left: var(--sl); bottom: calc(0.5rem + env(safe-area-inset-bottom, 0px));

}

body.pad-open #sheet { visibility: hidden; }

/* ---------- 3D labels ---------- */
#labels { position: absolute; inset: 0; z-index: 3; pointer-events: none; overflow: hidden; }
#labels > * { position: absolute; left: 0; top: 0; will-change: transform; }
.dimtag, .valtag {
  pointer-events: auto; margin: -0.9375rem 0 0 -1.875rem; min-width: 3.75rem; height: 1.875rem; padding: 0 0.625rem; border-radius: 0.5625rem;

}
.valtag { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); font-size: 0.9375rem; height: 2.125rem; margin-top: -1.0625rem; }

.snap { width: 0; height: 0; }
.snap i { position: absolute; left: -0.375rem; top: -0.375rem; width: 0.75rem; height: 0.75rem; border-radius: 50%; border: 0.125rem solid var(--muted); }
.snap.on i { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 30%, transparent); }
.loupe { position: absolute; pointer-events: none; border-radius: 0.75rem; border: 0.125rem solid var(--accent); box-shadow: 0 0.25rem 1rem rgb(0 0 0 / 0.25); z-index: 4; }
.loupe i { position: absolute; left: 50%; top: 50%; width: 0.875rem; height: 0.875rem; margin: -0.4375rem 0 0 -0.4375rem; border: 0.0625rem solid var(--accent); border-radius: 50%; }
.snap.linger { animation: snapfade 1.2s ease-in forwards; }
@keyframes snapfade { 0%, 60% { opacity: 1; } 100% { opacity: 0; } }
.snap span { position: absolute; left: 0.75rem; top: 0.5rem; white-space: nowrap; font-size: 0.6875rem; font-weight: 700; letter-spacing: 0.05em; color: var(--accent); text-transform: uppercase; }
.meas:empty { display: none; }
.meas { margin-left: -2.5rem; font-family: var(--font-num); font-size: 0.8125rem; padding: 0.1875rem 0.4375rem; border-radius: 0.4375rem; background: var(--ink); color: var(--panel-solid); white-space: nowrap; }
#boxsel { position: absolute; z-index: 3; border: 1.5px dashed var(--accent); background: var(--accent-soft); border-radius: 0.25rem; pointer-events: none; }

/* ---------- feature tree ---------- */
#tree {
  position: absolute; z-index: 9; left: var(--sl); top: calc(var(--tbh) + 0.5rem); bottom: calc(0.5rem + env(safe-area-inset-bottom, 0px));
  width: var(--tw); overflow-y: auto; overscroll-behavior: contain; background: var(--panel-solid); border: 1px solid var(--line); border-radius: 1.125rem; box-shadow: var(--shadow); padding: 0.375rem 0.375rem 0.875rem;
}
.th { display: flex; align-items: center; gap: 0.5rem; padding: 0.125rem 0.125rem 0.25rem 0.625rem; }
.th strong { font-size: 0.9375rem; }
.th .tms { margin-left: auto; font-family: var(--font-num); font-size: 0.6875rem; color: var(--faint); }
.tnote { margin: 0 0.625rem 0.375rem; font-size: 0.8125rem; color: var(--accent); }
.ftree, .ftree ul { list-style: none; margin: 0; padding: 0; }
.ftree li { display: flex; align-items: center; gap: 0.125rem; min-height: 2.125rem; padding-left: calc(var(--d, 0) * 1rem); border-radius: 0.625rem; position: relative; }
.ftree li.sel { background: var(--accent-soft); }
.ftree li.picked { background: color-mix(in srgb, var(--add) 16%, transparent); }
.ftree li.after .fn, .ftree li.after .fi { opacity: 0.4; }

.ftree li.sup .fi { opacity: 0.4; }

.ftree .car { width: 1.75rem; height: 2.25rem; display: grid; place-items: center; color: var(--muted); flex: none; }
.ftree .car svg { width: 0.875rem; height: 0.875rem; transition: transform 0.15s; }
.ftree .car[aria-expanded="true"] svg { transform: rotate(90deg); }
.ftree .fi { width: 1.625rem; display: grid; place-items: center; color: var(--muted); flex: none; }
.ftree .fi svg { width: 1.1875rem; height: 1.1875rem; }
.ftree .fn { flex: 1; min-width: 0; text-align: left; font-weight: 600; font-size: 0.8438rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0.4375rem 0.25rem; }
.ftree .fn.plain { font-weight: 600; cursor: default; }
.ftree .tag { font-family: var(--font-num); font-weight: 500; color: var(--sketch); margin-right: 0.25rem; }
.ftree .tag.bad { color: var(--cut); }
.ftree .badge { width: 1.25rem; height: 1.25rem; border-radius: 50%; background: var(--cut); color: #fff; font-size: 0.75rem; font-weight: 700; display: grid; place-items: center; flex: none; }
.ftree .badge.w { background: var(--warn); }
.ftree .fm, .ftree .eye { width: 1.875rem; height: 1.875rem; border-radius: 0.5625rem; display: grid; place-items: center; color: var(--muted); flex: none; }
.ftree .fm svg, .ftree .eye svg { width: 1.125rem; height: 1.125rem; }
.ftree .fm:hover, .ftree .eye:hover { background: var(--line); color: var(--ink); }
.ftree .sub { padding-left: 1.625rem; }
.ftree .br .sw { width: 0.8125rem; height: 0.8125rem; border-radius: 50%; background: var(--c); border: 1px solid var(--line-2); flex: none; margin: 0 0.25rem; }
.ftree .rbar button { display: flex; align-items: center; gap: 0.5rem; width: 100%; height: 2.125rem; padding: 0 0.625rem; border-radius: 0.5625rem; color: var(--accent); font-size: 0.7812rem; font-weight: 700; background: var(--accent-soft); border-top: 0.125rem solid var(--accent); }
.ftree .empty { padding: 0.5rem 0.75rem; color: var(--muted); font-size: 0.8438rem; }
.mini { height: 1.875rem; padding: 0 0.625rem; border-radius: 0.5625rem; background: var(--panel-2); border: 1px solid var(--line); font-size: 0.7812rem; font-weight: 600; }
.mini.danger { color: var(--cut); }

/* ---------- popover menus ---------- */
#sheet .calc { margin: 0.25rem 0 0.375rem; padding: 0.375rem 0.5rem; border-radius: 0.375rem; background: var(--line); font-size: 0.8125rem; line-height: 1.45; white-space: pre-line; font-variant-numeric: tabular-nums; }
#pop { position: absolute; z-index: 12; max-height: calc(100% - 3.5rem); overflow-y: auto; background: var(--panel-solid); border: 1px solid var(--line); border-radius: 1rem; box-shadow: var(--shadow); padding: 0.375rem; }

#pop .pi { display: flex; flex-direction: column; align-items: flex-start; width: 100%; text-align: left; padding: 0.625rem 0.75rem; border-radius: 0.625rem; font-weight: 600; font-size: 0.9375rem; gap: 1px; cursor: pointer; }

#pop .pi:hover { background: var(--line); }
#pop .pi[aria-pressed="true"] { color: var(--accent); }
#pop .pi[aria-pressed="true"]::after { content: "✓"; position: absolute; right: 1.375rem; }
#pop .pi { position: relative; }
#pop .sep { border-top: 1px solid var(--line); margin: 0.375rem 0.25rem; }
#pop .pgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.25rem; padding: 0.25rem; }
#pop .pv { height: 2.375rem; border-radius: 0.5625rem; background: var(--panel-2); font-size: 0.8125rem; font-weight: 600; }
#pop .pv:hover { color: var(--accent); }
#pop .pt { display: flex; align-items: center; gap: 0.75rem; width: 100%; text-align: left; padding: 0.5625rem 0.75rem; font-size: 0.9062rem; font-weight: 500; }
#pop .pt.uis { flex-direction: column; align-items: flex-start; gap: 0.375rem; }
#pop .pt.uis .chip { height: 1.75rem; padding: 0 0.625rem; }
#pop .foot { margin: 0.375rem 0.75rem 0.5rem; font-size: 0.7812rem; line-height: 1.45; color: var(--muted); }

/* ---------- radial (S Pen button) ---------- */
#radial { position: absolute; z-index: 25; width: 0; height: 0; }
#radial .rc { position: absolute; left: -0.4375rem; top: -0.4375rem; width: 0.875rem; height: 0.875rem; border-radius: 50%; background: var(--accent); }
#radial button { position: absolute; left: -2.125rem; top: -1.5rem; width: 4.25rem; height: 3rem; border-radius: 1rem; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; background: var(--panel-solid); border: 1px solid var(--line); box-shadow: var(--shadow); font-size: 0.7188rem; font-weight: 600; }
#radial button svg { width: 1.1875rem; height: 1.1875rem; }
#radial button span { font-size: 0.6875rem; }
#radial button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

/* ---------- designs (home) ---------- */
#home { position: absolute; inset: 0; z-index: 15; overflow-y: auto; background: linear-gradient(180deg, var(--bg), var(--bg2)); padding: 0.875rem max(1rem, env(safe-area-inset-right, 0px)) 1.5rem max(1rem, env(safe-area-inset-left, 0px)); }
.hh { display: flex; align-items: center; justify-content: space-between; gap: 0.625rem; flex-wrap: wrap; margin: 0.25rem 0 1rem; }
.hh b { display: block; font-size: 1.5rem; font-weight: 700; letter-spacing: 0.02em; }
.hh b i, .ld b i { font-style: normal; color: var(--accent); }
.hh span { color: var(--muted); font-size: 0.875rem; }
.hb { display: flex; gap: 0.375rem; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(9.75rem, 1fr)); gap: 0.75rem; }
.card { background: var(--panel-solid); border: 1px solid var(--line); border-radius: 1rem; overflow: hidden; display: flex; flex-direction: column; box-shadow: var(--shadow); min-width: 0; }
.card.cur { border-color: var(--accent); }
.card.new { align-items: center; justify-content: center; gap: 0.5rem; min-height: 12.5rem; border-style: dashed; border-width: 1.5px; background: transparent; box-shadow: none; color: var(--accent); }
.card.new .nb { width: 3.25rem; height: 3.25rem; border-radius: 50%; background: var(--accent-soft); display: grid; place-items: center; }
.card.new .cn { font-weight: 700; }
.thumb { aspect-ratio: 3 / 2; width: 100%; max-width: 100%; background: var(--panel-2); display: grid; place-items: center; overflow: hidden; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.nothumb svg { width: 2.5rem; height: 2.5rem; color: var(--faint); }
.cm { padding: 0.5rem 0.625rem 0.25rem; display: flex; flex-direction: column; min-width: 0; }
.cm .cn { font-weight: 700; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cm .cd { font-size: 0.75rem; color: var(--muted); font-family: var(--font-num); }
.cx { display: flex; flex-wrap: wrap; gap: 0.25rem; padding: 0.25rem 0.5rem 0.625rem; }
.hbar { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 0.75rem; margin: 0 0 0.75rem; }
.crumbs { display: flex; align-items: center; gap: 0.25rem; flex: 1 1 auto; min-width: 0; flex-wrap: wrap; }
.crumb { font-weight: 600; padding: 0.25rem 0.375rem; border-radius: 0.375rem; color: var(--accent); }
.crumb:last-child { color: var(--text); }
.csl { color: var(--faint); }
.card.fold { min-height: 0; }
.fbtn { display: flex; flex-direction: column; align-items: flex-start; gap: 0.125rem; padding: 0.75rem 0.75rem 0.25rem; width: 100%; text-align: left; }
.fbtn .fic svg { width: 2.25rem; height: 2.25rem; }
.fbtn .cn { font-weight: 700; } .fbtn .cd { font-size: 0.75rem; color: var(--muted); }
.thumb { position: relative; }
/* opening a file: the tapped card shows progress, the rest of the screen waits */
#home.opening .card:not(.opening), #home.opening .hb .act:not(.opening) { opacity: 0.55; pointer-events: none; }
.card.opening .thumb::after { content: "Opening…"; position: absolute; inset: 0; display: grid; place-items: center; font-weight: 700; color: #fff; background: rgb(0 0 0 / 0.45); }
.card.opening .thumb::before { content: ""; position: absolute; left: 50%; top: 50%; width: 1.75rem; height: 1.75rem; margin: -2.75rem 0 0 -0.875rem; border-radius: 50%; border: 0.1875rem solid rgb(255 255 255 / 0.35); border-top-color: #fff; animation: spin 0.8s linear infinite; z-index: 1; }
.act.opening { opacity: 0.7; }
@keyframes spin { to { transform: rotate(360deg); } }
.ftype { position: absolute; left: 0.375rem; bottom: 0.375rem; display: inline-flex; align-items: center; gap: 0.25rem; padding: 0.125rem 0.375rem; border-radius: 0.375rem; background: var(--panel-solid); font-size: 0.6875rem; font-weight: 700; color: var(--muted); }
.ftype svg { width: 0.875rem; height: 0.875rem; }
.ftype.assembly { color: var(--accent); }
.cm .cn i { font-style: normal; font-weight: 500; color: var(--faint); font-size: 0.75rem; margin-left: 0.125rem; }
.hempty { color: var(--muted); grid-column: 1 / -1; }
.card select { font: inherit; padding: 0.25rem; border-radius: 0.375rem; border: 1px solid var(--line); background: var(--panel-solid); color: var(--text); max-width: 100%; }
.card .confirm { display: flex; flex-wrap: wrap; align-items: center; gap: 0.375rem; padding: 0 0.625rem 0.625rem; font-size: 0.8125rem; }

/* ---------- loading ---------- */
#loading { position: absolute; inset: 0; z-index: 40; display: grid; place-items: center; background: linear-gradient(180deg, var(--bg), var(--bg2)); padding-inline: max(1rem, env(safe-area-inset-left, 0px)) max(1rem, env(safe-area-inset-right, 0px)); }
.ld { width: min(20rem, 100%); display: flex; flex-direction: column; gap: 0.625rem; }
.ld b { font-size: 1.75rem; font-weight: 700; letter-spacing: 0.02em; }
.ld p { margin: 0; color: var(--muted); font-size: 0.875rem; }
.track { height: 0.25rem; border-radius: 0.25rem; background: var(--line); overflow: hidden; }
#loadbar { height: 100%; width: 2%; background: var(--accent); transition: width 0.2s; }
#loaderr { font-family: var(--font-num); font-size: 0.75rem; color: var(--warn); word-break: break-word; }
body.busy #view { cursor: progress; }
body.busy .act.primary { opacity: 0.6; pointer-events: none; }

/* ---------- confirm corner, status, sketch labels ---------- */
#corner { display: flex; flex-direction: row; gap: 0.5rem; }
.cc { width: 2.875rem; height: 2.875rem; border-radius: 0.8125rem; display: grid; place-items: center; box-shadow: var(--shadow); border: 1px solid var(--line); }
.cc svg { width: 1.625rem; height: 1.625rem; stroke-width: 2.1; }
.cc.ok { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.cc.no { background: var(--panel-solid); color: var(--cut); }
.pill { margin-left: auto; flex: none; font-size: 0.75rem; font-weight: 700; padding: 0.3125rem 0.5625rem; border-radius: 62.4375rem; white-space: nowrap; }
.pill.under { color: var(--sketch); background: color-mix(in srgb, var(--sketch) 13%, transparent); }
.pill.full { color: var(--ink); background: var(--line); }
.pill.over { color: #fff; background: var(--cut); }
.dimtag.sk { min-width: 0; height: 1.625rem; margin: -0.8125rem 0 0 0; transform-origin: 0 0; padding: 0 0.4375rem; font-size: 0.8125rem; border-width: 1px; border-color: var(--line-2); translate: -50% 0; }
.dimtag.sk.driven { color: var(--muted); border-style: dashed; }
.dimtag.sk.bad { color: var(--cut); border-color: var(--cut); }
.dimtag.sk.sel { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 0 0.125rem var(--accent-soft), var(--shadow); }
.dimtag.sk.pend { border-color: var(--accent); color: var(--accent); pointer-events: none; }
.dimtag.feat { border-color: var(--accent); }
.relg { pointer-events: auto; margin: -0.625rem 0 0 -0.625rem; min-width: 1.25rem; height: 1.25rem; padding: 0 0.25rem; border-radius: 0.375rem; font-size: 0.7188rem; font-weight: 700; line-height: 1.125rem; text-align: center; background: color-mix(in srgb, var(--ok) 16%, var(--panel-solid)); color: var(--ok); border: 1px solid color-mix(in srgb, var(--ok) 45%, transparent); }
.relg.sel { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.relg.bad { background: var(--cut); color: #fff; border-color: var(--cut); }
.chip.rel { color: var(--ink); }
.chip.exist { display: inline-flex; align-items: center; gap: 0.375rem; color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, transparent); }
.chip.exist .x { font-size: 1rem; color: var(--muted); }
.planetag { pointer-events: auto; margin: -0.9375rem 0 0 -0.375rem; height: 1.875rem; padding: 0 0.6875rem; border-radius: 0.5625rem; font-size: 0.8125rem; font-weight: 700; color: var(--plane); background: var(--panel-solid); border: 1.5px solid var(--plane); box-shadow: var(--shadow); }
.np-vars { display: flex; flex-wrap: wrap; gap: 0.375rem; padding: 0.625rem 0.125rem 0.125rem; }
.np-vars button { height: 2.125rem; padding: 0 0.75rem; border-radius: 62.4375rem; border: 1px solid var(--accent); color: var(--accent); font-family: var(--font-num); font-size: 0.875rem; }
.eqs { display: flex; flex-direction: column; gap: 0.25rem; }
.eqrow { display: grid; grid-template-columns: minmax(3.75rem, auto) auto 1fr auto auto; align-items: center; gap: 0.5rem; min-height: 2.625rem; padding: 0 0.25rem 0 0.625rem; border-radius: 0.6875rem; background: var(--panel-solid); border: 1px solid var(--line); }
.eqrow.lk { grid-template-columns: 1fr auto auto auto; }
.eqn { font-weight: 700; text-align: left; font-family: var(--font-num); }
.eqx { font-family: var(--font-num); text-align: left; color: var(--accent); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.eqeq { color: var(--muted); }
.eqv { font-family: var(--font-num); color: var(--muted); }
.trio.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.trio.two .fval i { display: inline; }
body.sketching #view { cursor: crosshair; }
#sheet.compact { gap: 0.5rem; }

/* =====================================================================
   Desktop-CAD chrome: flat grey toolbars, docked panes, small radii,
   light-blue selection, checkboxes, green OK / red Cancel (SolidWorks-like).
   ===================================================================== */
:root {
  --font-ui: Roboto, "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-num: Roboto, "Segoe UI", system-ui, -apple-system, sans-serif;
  --chrome: #f1f3f5; --chrome-2: #e4e8ec; --chrome-line: #c3cad2;
  --btn-a: #ffffff; --btn-b: #eceff2;
  --sel: #d9e8fb; --sel-line: #78a6e0; --ui-acc: #1d5fc4;
  --panel: #f6f7f9; --panel-solid: #ffffff; --panel-2: #eef1f4;
  --shadow: 0 1px 2px rgba(20, 28, 36, 0.16), 0 0.25rem 0.75rem rgba(20, 28, 36, 0.08);
  --r: 0.25rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --chrome: #2d3238; --chrome-2: #262a2f; --chrome-line: #3e464f; --btn-a: #3a4048; --btn-b: #31363d;
    --sel: #23446d; --sel-line: #4f86cf; --ui-acc: #72aaff; --panel: #2a2e34; --panel-solid: #31363c; --panel-2: #282c32;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.5), 0 0.25rem 0.75rem rgba(0, 0, 0, 0.35);
  }
}
:root[data-theme="dark"] {

#docName { font-weight: 600; border-radius: var(--r); }
input.rn { border-radius: var(--r); border-color: var(--ui-acc); }
.ctab { font-weight: 500; color: var(--ink); opacity: 0.8; padding: 0 0.875rem; border-top-width: 0; }

.cfa svg { width: 0.75rem; height: 0.75rem; stroke-width: 2.4; }

#fly .fi:hover, #fly .fi[aria-pressed="true"] { background: var(--sel); }
/* PropertyManager: docked pane; the selection card floats */
#sheet { left: 0; top: var(--tbh); bottom: 0; max-height: none; width: calc(var(--pm) + env(safe-area-inset-left, 0px)); border: 0; border-right: 1px solid var(--chrome-line); border-radius: 0; box-shadow: 0.125rem 0 0.5rem rgba(20, 28, 36, 0.06); backdrop-filter: none; background: var(--panel); padding: 0.625rem 0.625rem calc(0.75rem + env(safe-area-inset-bottom, 0px)) max(0.625rem, env(safe-area-inset-left, 0px)); gap: 0.625rem; }
#sheet.compact { left: var(--sl); top: calc(var(--tbh) + 0.5rem); bottom: auto; width: var(--pm); max-height: calc(100% - var(--tbh) - 1rem); border: 1px solid var(--chrome-line); border-radius: 0.375rem; box-shadow: var(--shadow); padding: 0.625rem; }
body.tree-open #sheet, body.tree-open #numpad { left: calc(var(--tw) + env(safe-area-inset-left, 0px)); }

#tree, #sheet { box-sizing: border-box; }

.act { height: 2rem; padding: 0 0.625rem 0 0.5rem; border-radius: var(--r); font-size: 0.8125rem; font-weight: 500; background: linear-gradient(var(--btn-a), var(--btn-b)); border: 1px solid var(--chrome-line); gap: 0.375rem; }

.act.ghost svg.mono { color: var(--muted); }
.act.ghost:hover { background: var(--btn-a); border-color: var(--chrome-line); }
.act.mini { height: 1.75rem; font-size: 0.75rem; }
.slot { height: 2rem; border-radius: var(--r); border: 1px solid var(--chrome-line); background: var(--panel-solid); font-size: 0.8125rem; }
.slot.filled { border-style: solid; }
.slot.active { background: var(--sel); border-color: var(--sel-line); }
.slot .dot { border-radius: 2px; border-color: var(--chrome-line); }
.slot.filled .dot { background: var(--ui-acc); border-color: var(--ui-acc); }
.field { height: 2.125rem; border-radius: var(--r); border-color: var(--chrome-line); }
.flab { font-size: 0.6875rem; letter-spacing: 0.03em; border-right: 1px solid var(--chrome-line); font-weight: 600; }
.fval b { font-size: 0.9375rem; font-weight: 500; }
.trio .fval b { font-size: 0.875rem; }
.fval:hover b { color: var(--ui-acc); }
.clab { font-size: 0.6875rem; letter-spacing: 0.04em; font-weight: 600; }

.more { color: var(--ui-acc); font-weight: 500; }
.pill { border-radius: var(--r); font-weight: 600; }
.operr { border-radius: var(--r); }
.note { font-size: 0.75rem; }

#pop .pi[aria-pressed="true"] { color: var(--ink); background: var(--sel); }
#pop .pv { border-radius: var(--r); background: linear-gradient(var(--btn-a), var(--btn-b)); border: 1px solid var(--chrome-line); font-weight: 500; }

/* =====================================================================

:root[data-theme="sw"] {

  --btn-a: #4a4a4a; --btn-b: #3e3e3e; --sel: #2c5687; --sel-line: #5b9be6; --ui-acc: #6cabff;
  --ic-k: #1d1a14; --ic-y: #f6c23d; --ic-y2: #cf8714; --ic-y3: #ffe9a8; --ic-b: #3d8bff; --ic-b3: #a7c9fb; --ic-g: #d4dae0; --ic-g2: #9ba6b1; --ic-w: #ffffff; --ic-r: #ff4b40; --ic-ok: #3fd067; --ic-line: #dedede;
  color-scheme: dark;

/* =====================================================================

:root[data-theme="korugan"] {

/* ---------- Render tab ---------- */
#rpanel { position: absolute; z-index: 6; left: 0; top: var(--tbh); bottom: 0; width: calc(19.5rem + env(safe-area-inset-left, 0px)); box-sizing: border-box; overflow-y: auto; overscroll-behavior: contain; background: var(--panel-solid); border-right: 1px solid var(--chrome-line); padding: 0.75rem 0.75rem calc(1rem + env(safe-area-inset-bottom, 0px)) max(0.75rem, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 0.75rem; }

body.rmode.r-clear #view { background: repeating-conic-gradient(#1b1b1b 0 25%, #222 0 50%) 0 0 / 1.25rem 1.25rem; }
.rh { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; padding-bottom: 0.5rem; border-bottom: 1px solid var(--chrome-line); }

.rsw { display: flex; flex-direction: column; align-items: center; gap: 0.3125rem; padding: 0.5rem 0.25rem 0.4375rem; border: 1px solid transparent; touch-action: pan-y; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; cursor: grab; }

.rsw[aria-pressed="true"] { border-color: var(--sand, var(--accent)); background: var(--sel, var(--accent-soft)); }
.rsw img, .rsel img { width: 3.5rem; height: 3.5rem; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #2a2a2a, #161616); display: block; }
.rsw img:not([src]), .rsel img:not([src]) { animation: rpulse 1.2s ease-in-out infinite alternate; }
@keyframes rpulse { from { opacity: 0.35; } to { opacity: 0.8; } }
.rsw span { font-size: 0.6875rem; line-height: 1.2; text-align: center; color: var(--muted); }
.rsw[aria-pressed="true"] span { color: var(--ink); }

.rsl { display: grid; grid-template-columns: 5.75rem minmax(0, 1fr) 2.75rem; align-items: center; gap: 0.5rem; font-size: 0.75rem; color: var(--muted); }
.rsl output { font-family: var(--font-num); font-size: 0.6875rem; color: var(--ink); text-align: right; white-space: nowrap; }
.rsl input[type="range"] { width: 100%; height: 1.75rem; accent-color: var(--sand, var(--accent)); background: transparent; margin: 0; touch-action: pan-y; }
.rcols { display: flex; flex-wrap: wrap; gap: 0.3125rem; }
.rc { width: 1.5rem; height: 1.5rem; border: 1px solid rgba(255, 255, 255, 0.18); box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.35); padding: 0; position: relative; display: grid; place-items: center; }

#rframe i:nth-child(3) { left: -2px; bottom: -2px; border-right: 0; border-top: 0; }

.rdrag { position: fixed; z-index: 60; width: 3.75rem; height: 3.75rem; border-radius: 50%; pointer-events: none; transform: translate(-50%, -70%); box-shadow: 0 0.5rem 1.5rem rgba(0, 0, 0, 0.55), 0 0 0 2px var(--sand, #c7b49e); }

  #rpanel, body.tree-open #rpanel { left: 0; right: 0; top: auto; width: auto; height: 46%; border-right: 0; border-top: 1px solid var(--chrome-line); }
}

/* STEP import progress */
#importdlg { position: absolute; z-index: 30; left: 50%; bottom: calc(1rem + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: min(26rem, calc(100% - 2rem)); display: grid; grid-template-columns: 1fr auto; gap: 0.5rem 0.75rem; align-items: center; padding: 0.75rem 0.75rem 0.75rem 1rem; background: var(--panel-solid); border: 1px solid var(--chrome-line); box-shadow: var(--shadow); }
#importdlg .idl { display: flex; flex-direction: column; gap: 0.125rem; min-width: 0; }

#importdlg .ist { font-size: 0.75rem; color: var(--muted); }
#importdlg .itm { font-family: var(--font-num); font-size: 0.6875rem; color: var(--sand, var(--accent)); }

@keyframes islide { from { transform: translateX(-100%); } to { transform: translateX(340%); } }

/* =====================================================================
   Liquid glass (the default theme). Floating glass islands over a
   graphite studio: a capsule for the document, a segmented control for
   the tabs with a pill that stretches as it travels, a command shelf,
   and panels that float in from the edges. Everything that moves in
   answer to a touch moves on a spring. Korugan sand is the tint colour.
   ===================================================================== */
.tpill { display: none; }
:root[data-theme="glass"] {
  --sand: #c7b49e; --sand-d: #9e8a75; --sand-l: #e6dccd;
  --bg: #1d1d1d; --bg2: #070707;
  --ink: #f2f2f2; --muted: rgba(242, 240, 236, 0.62); --faint: rgba(242, 240, 236, 0.34);

#rpanel .rusedrow { display: flex; gap: 0.375rem; overflow-x: auto; scrollbar-width: none; padding: 0.3125rem 0.125rem 0.375rem; scroll-snap-type: x proximity; overscroll-behavior-x: contain; }
#rpanel .rusedrow::-webkit-scrollbar { display: none; }
#rpanel .ruse { flex: none; width: 4.875rem; display: grid; justify-items: center; align-content: start; gap: 0.125rem; padding: 0.4375rem 0.25rem 0.375rem; border-radius: 0.875rem; border: 1px solid var(--line); background: var(--btn-b, transparent); color: var(--ink); scroll-snap-align: start; transition: background-color 0.25s, border-color 0.25s, scale 0.35s var(--spring, ease); }
#rpanel .ruse:active { scale: 0.94; }
#rpanel .ruse img { width: 2.625rem; height: 2.625rem; border-radius: 50%; margin-bottom: 0.125rem; }
#rpanel .ruse span { font-size: 0.625rem; font-weight: 600; line-height: 1.15; text-align: center; max-height: 2.3em; overflow: hidden; }
#rpanel .ruse small { font-size: 0.5625rem; color: var(--muted); white-space: nowrap; }
#rpanel .ruse[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
:root[data-theme="glass"] #rpanel .ruse { border: 0; background: rgba(255, 255, 255, 0.055); box-shadow: inset 0 0 0 0.5px rgba(255, 255, 255, 0.12); }
:root[data-theme="glass"] #rpanel .ruse[aria-pressed="true"] { background: var(--accent-soft); box-shadow: inset 0 0 0 0.5px rgba(230, 220, 205, 0.55); }

/* landscape: the feature tree stays on the left, tool options and render
   settings open on the right; the view buttons move over beside them */
@media (orientation: landscape) {
  :root[data-theme="glass"] #sheet, :root[data-theme="glass"] #sheet.compact, :root[data-theme="glass"] body.tree-open #sheet, :root[data-theme="glass"] body.tree-open #sheet.compact { left: auto; right: var(--sr); transform-origin: 100% 0; }
  :root[data-theme="glass"] #rpanel, :root[data-theme="glass"] body.tree-open #rpanel { left: auto; right: var(--sr); transform-origin: 100% 0; }
  :root[data-theme="glass"] #numpad, :root[data-theme="glass"] body.tree-open #numpad { left: auto; right: var(--sr); transform-origin: 100% 100%; }
  :root[data-theme="glass"] .viewcol { transition: right 0.55s var(--spring-soft); }
  :root[data-theme="glass"] body:has(#sheet:not([hidden]):not([data-tucked])) .viewcol { right: calc(var(--sr) + var(--pm) + 0.5rem); }
  :root[data-theme="glass"] body:has(#rpanel:not([hidden]):not([data-tucked])) .viewcol { right: calc(var(--sr) + 19.5rem + 0.5rem); }
  :root[data-theme="glass"] #sheet:not([hidden]), :root[data-theme="glass"] #rpanel:not([hidden]) { animation-name: g-slide-r; }
}
@keyframes g-slide-r { from { opacity: 0; translate: 0.75rem 0; scale: 0.97; } to { opacity: 1; translate: 0 0; scale: 1; } }

/* ---------- iPad / iPhone (html.ios): behave like an app, not a web page ---------- */
/* the page itself never moves: no rubber-band bounce, no scrolling of the whole
   app, no pinch or double-tap zoom; only panels scroll, inside themselves */
html.ios { padding: 0 !important; height: 100%; overflow: hidden; overscroll-behavior: none; touch-action: pan-x pan-y; -webkit-text-size-adjust: 100%; }
html.ios body { position: fixed; inset: 0; height: auto; overflow: hidden; overscroll-behavior: none; }
html.ios #app { position: absolute; inset: 0; height: auto; }
html.ios:not([data-theme="glass"]) #app { top: env(safe-area-inset-top, 0px); bottom: env(safe-area-inset-bottom, 0px); }
html.ios #sheet, html.ios #tree, html.ios #rpanel, html.ios #pop, html.ios #home, html.ios .crow, html.ios .ctabs, html.ios .rusedrow, html.ios .rcats { overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
/* no selection, loupes, callouts or drag ghosts from touching the interface */
html.ios, html.ios * { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
html.ios img, html.ios svg { -webkit-user-drag: none; }
html.ios input, html.ios textarea, html.ios [contenteditable] { -webkit-user-select: text; user-select: text; }
/* buttons answer at once (no wait for a possible double-tap zoom) */
html.ios button, html.ios label, html.ios .chip, html.ios .ctab, html.ios .cb, html.ios .pi, html.ios .card, html.ios a { touch-action: manipulation; }
/* Safari zooms the page into any text field under 16 px and stays zoomed */
html.ios input:not([type="range"]):not([type="color"]):not([type="checkbox"]), html.ios textarea, html.ios select { font-size: 16px !important; }
/* things dragged sideways (value scrubbing, dimension labels, the view
   cube, the quick menu) must not hand the gesture to Safari's scrolling */
html.ios .flab { touch-action: pan-y; }
html.ios #labels, html.ios #labels *, html.ios #cube, html.ios #cube *, html.ios #radial, html.ios #radial *, html.ios .tucktab, html.ios #numpad { touch-action: none; }
/* pressed state stands in for hover on a screen without one */
html.ios button:active, html.ios .chip:active, html.ios .pi:active { filter: brightness(1.18); }
